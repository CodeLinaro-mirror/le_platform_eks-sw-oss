apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: csm-x100-eks-hwmgrdaemonset
  name: csm-x100-eks-hwmgrdaemonset
  namespace: x100-operator-resources
spec:
  selector:
    matchLabels:
      app: csm-x100-eks-hwmgrdaemonset
  template:
    metadata:
      labels:
        app: csm-x100-eks-hwmgrdaemonset
    spec:
      serviceAccount: csm-x100boot-eks-sa
      serviceAccountName: csm-x100boot-eks-sa
      securityContext:
        runAsUser: 0
      imagePullSecrets:
      - name: csm-x100-eks-pullsecret
      containers:
      - name: csm-x100-eks-hwmgrcontainer
        image: #"<Replace with HwManager Pod image>"
        imagePullPolicy: Always
        securityContext:
          privileged: true
          runAsUser: 0
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "rm -rf /var/tmp/hwmgr-running"]
        volumeMounts:
        - mountPath: /var/lib/firmware/qcom/lassen
          name: hostpath-privileged
        - mountPath: /dev
          name: dev
        - mountPath: /var/log
          name: varlog
        - mountPath: /sys/fs/cgroup
          name: sysfscgroup
        - mountPath: /var/tmp
          name: csm-hwmgr-status
      - name: csm-x100-eks-hwmgrlogs1
        image: registry.access.redhat.com/ubi8/ubi-minimal
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: varlog
          mountPath: /var/log
        args:
        - /bin/sh
        - -c
        - "tail -n+1 -F /var/log/QSaharaServer_0.log /var/log/QSaharaServer_1.log /var/log/QSaharaServer_2.log  /var/log/QSaharaServer_3.log /var/log/csm_device_0.log /var/log/csm_device_1.log /var/log/csm_device_2.log /var/log/csm_device_3.log"
      - name: csm-x100-eks-hwmgrlogs2
        image: registry.access.redhat.com/ubi8/ubi-minimal
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: varlog
          mountPath: /var/log
        args:
        - /bin/sh
        - -c
        - "tail -n+1 -F /var/log/device0/journal.log /var/log/device1/journal.log /var/log/device2/journal.log /var/log/device3/journal.log"
      hostNetwork: true
      volumes:
      - name: hostpath-privileged
        hostPath:
          path: /var/lib/firmware/qcom/lassen
      - name: dev
        hostPath:
          path: /dev
      - name: sysfscgroup
        hostPath:
          path: /sys/fs/cgroup
          type: Directory
      - name: csm-hwmgr-status
        hostPath:
          path: /tmp
          type: Directory
      - name: varlog
        emptyDir: {}
      nodeSelector:
        qualcomm.com/x100.present: "true"
