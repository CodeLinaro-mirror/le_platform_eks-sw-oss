apiVersion: qualcomm.com/v1
kind: X100ManagementPolicy
metadata:
  name: x100managementpolicy-v2
spec:
  swVersion: v2
  enableRollback: false
  nodeSelectors:
  - <Node-Name> #ToBeReplaced
  x100Resources:
    firmware:
      repository: #<CIR registry URL>
      image: fwpod
      version: v2
      imagePullPolicy: Always
      imagePullSecrets:
      - eks-pull-secret
    hwManager:
      repository: #<CIR registry URL>
      image: hwmgr
      version: v2
      expRepository: #<CIR registry URL>
      expImage: exporter
      expVersion: v2
      imagePullPolicy: Always
      imagePullSecrets:
      - eks-pull-secret
    kModule:
      repository: #<CIR registry URL>
      image: kmodules
      version: v2
      tag: AU_LINUX_EMBEDDED_LE.LNXHOSTSW.2.0_TARGET_ALL.01.404.260
      dtkAutoImage: #<CIR registry URL>/<dtk-auto-image>
      dtkSrcImage: #<CIR registry URL>/<dtk-src-image>:v2
      imageRepoSecret: eks-pull-secret
    devicePlugin:
      repository: #<CIR registry URL>
      image: csmdp
      version: v2
      imagePullPolicy: Always
      imagePullSecrets:
      - eks-pull-secret
