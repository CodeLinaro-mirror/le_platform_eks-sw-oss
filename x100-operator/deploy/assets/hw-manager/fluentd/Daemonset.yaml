apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd
  namespace: x100-operator-resources
  labels:
    app: fluentd
spec:
  selector:
    matchLabels:
      name: fluentd
  template:
    metadata:
      labels:
        name: fluentd
    spec:
      containers:
      - name: fluentd
        image: <fluentd image>
        env:
        - name: FLUENTD_CONF
          value: fluentd.conf
        volumeMounts:
        - name: config-volume
          mountPath: /fluentd/etc
        - name: varlog
          mountPath: /var/log
      volumes:
      - name: config-volume
        configMap:
          name: fluentd-config
      - name: varlog
        hostPath:
          path: /var/log
