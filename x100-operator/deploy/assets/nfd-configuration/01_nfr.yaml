apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: csm-x100-nfr
spec:
  rules:
    - name: "csm-x100-nfr"
      labelsTemplate: |
        {{ range .pci.device }}pci-{{ .class }}_{{ .vendor }}_{{ .device }}.present=true
        {{ end }}
      matchFeatures:
        # Match if any PCI device with vendor 17cb and class 1200 exists in the system
        - feature: pci.device
          matchExpressions:
            vendor: {op: In, value: ["17cb"]}
            class: {op: In, value: ["1200"]}
